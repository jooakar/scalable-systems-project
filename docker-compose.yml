services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qo
    restart: always

  # Checkpoints must be readable by the JobManager and every TaskManager, so they share a
  # volume; Flink runs as uid 9999 and a fresh volume is owned by root
  flink-checkpoints-init:
    image: busybox:1.37.0
    command: chown 9999:9999 /checkpoints
    volumes:
      - flink-checkpoints:/checkpoints
    restart: "no"

  jobmanager:
    image: flink:2.3.0-java21
    container_name: flink-jobmanager
    depends_on:
      flink-checkpoints-init:
        condition: service_completed_successfully
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
    restart: always

  taskmanager:
    image: flink:2.3.0-java21
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
        # The HashMap state backend keeps state on the heap and needs no managed memory
        taskmanager.memory.managed.fraction: 0.1
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
    restart: always

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg18
    container_name: timescaledb
    ports:
      - "${TIMESCALEDB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    volumes:
      - timescaledb-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: trading-web
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "7070:7070"
    environment:
      DB_URL: jdbc:postgresql://timescaledb:5432/trading
      DB_USER: trading
      DB_PASSWORD: trading
      WEB_PORT: 7070
    restart: always

  flink-job-submitter:
    build:
      context: .
      dockerfile: Dockerfile.flink-job
    container_name: flink-job-submitter
    depends_on:
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
      kafka:
        condition: service_started
      timescaledb:
        condition: service_healthy
    environment:
      JOBMANAGER_URL: http://jobmanager:8081
      PARALLELISM: ${PARALLELISM:-1}
    restart: "no"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: always

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    depends_on:
      - web
      - cadvisor
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: always

volumes:
  flink-checkpoints:
  timescaledb-data:
  grafana-data:
