global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: trading-web
    metrics_path: /metrics
    static_configs:
      - targets: [web:7070]

  - job_name: flink-jobmanager
    static_configs:
      - targets: [jobmanager:9249]

  # Resolves every replica of the scalable taskmanager service
  - job_name: flink-taskmanager
    dns_sd_configs:
      - names: [taskmanager]
        type: A
        port: 9249

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
